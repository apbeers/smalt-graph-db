name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image has Chromium and its system packages; the renderer runs on its SwiftShader WebGPU adapter.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      NPM_CONFIG_PREFIX: /tmp/npm-global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g playwright@1.64.1
      - run: NODE_PATH=/tmp/npm-global/lib/node_modules npm run test:browser
